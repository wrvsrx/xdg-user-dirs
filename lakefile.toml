name = "xdg-user-dirs"
version = "0.4.0-dev"
defaultTargets = ["XdgUserDirs"]
testDriver = "XdgUserDirsTest"

[[require]]
name = "xdg"
git = "https://github.com/wrvsrx/xdg.git"
rev = "0.16.0"
version = "0.16.0"

[[lean_lib]]
name = "XdgUserDirs"
defaultFacets = ["static"]

[[lean_lib]]
name = "XdgUserDirsTest"
globs = [ "XdgUserDirsTest.+" ]
